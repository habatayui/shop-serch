<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗一覧</title>
  <style>
    :root {
      --page-bg: #fffaf7;
      --paper: #fffdfb;
      --text: #493b3c;
      --muted: #876f71;
      --soft: #f5d9d2;
      --blush: #e7978b;
      --rose: #f4b6a8;
      --cream: #ffeede;
      --sage: #b8ba9c;
      --line: #eac7bd;
      --shadow: rgba(130, 77, 70, 0.14);
      --serif: "Times New Roman", "Yu Mincho", serif;
      --sans: "Yu Gothic", "Noto Sans JP", "Hiragino Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background-color: var(--page-bg);
      background-image: radial-gradient(#dfbcb7 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 234, 219, 0.76), transparent),
        radial-gradient(circle at 50% 120%, rgba(223, 196, 171, 0.34), transparent 35%);
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    .shop-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
    }

    .store-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--line);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--cream) 0%, var(--rose) 100%);
      border: 2px solid var(--line);
      box-shadow: 0 0 0 4px rgba(244, 182, 168, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: var(--serif);
      font-size: 26px;
    }

    .brand-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .header-links span {
      width: 30px;
      height: 1px;
      background: var(--line);
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    .hero {
      background: rgba(255, 253, 251, 0.72);
      border: 1px dashed var(--line);
      border-radius: 30px;
      padding: clamp(20px, 4vw, 36px);
      box-shadow: 0 22px 60px var(--shadow);
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(260px, 0.9fr);
      gap: 28px;
      align-items: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--soft), transparent);
      right: -70px;
      top: -50px;
      filter: blur(14px);
      opacity: 0.6;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
    }

    .section-kicker {
      margin: 0 0 10px;
      color: var(--blush);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(44px, 6vw, 68px);
      line-height: 0.95;
      margin: 0 0 12px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .hero-title span {
      color: var(--blush);
      font-style: italic;
    }

    .hero-lede {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      max-width: 560px;
      margin: 0 0 22px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid var(--text);
      color: var(--text);
      background: var(--cream);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 8px 16px var(--shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px var(--shadow);
    }

    .hero-note {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-top: 12px;
    }

    .hero-card {
      position: relative;
      z-index: 1;
      min-height: 280px;
      border-radius: 26px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle, var(--paper) 0%, var(--cream) 100%);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 0 8px rgba(255, 250, 247, 0.6);
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--blush);
    }

    .hero-card::before {
      width: 180px;
      height: 180px;
      left: -16px;
      top: -16px;
    }

    .hero-card::after {
      width: 160px;
      height: 160px;
      right: -12px;
      bottom: -12px;
    }

    .mini-map {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background-image: radial-gradient(var(--rose) 1px, transparent 1px);
      background-size: 16px 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 9px rgba(244, 182, 168, 0.12);
    }

    .mini-map::before,
    .mini-map::after {
      content: "";
      position: absolute;
      background: var(--sage);
      border-radius: 50%;
      opacity: 0.96;
    }

    .mini-map::before {
      width: 72px;
      height: 72px;
      left: 18px;
      top: 16px;
      background: linear-gradient(135deg, var(--sage), var(--cream));
      box-shadow: 0 0 0 5px rgba(255, 250, 247, 0.7);
    }

    .mini-map::after {
      width: 42px;
      height: 42px;
      right: 22px;
      bottom: 16px;
      background: var(--blush);
    }

    .pin {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--text);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      box-shadow: 0 0 0 6px rgba(255, 253, 251, 0.9), 0 0 0 12px var(--rose);
      transform: translate(-50%, -50%);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin: 24px 0 18px;
    }

    .stat-card {
      background: rgba(255, 253, 251, 0.7);
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-card .icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blush);
      font-size: 20px;
    }

    .stat-card strong {
      display: block;
      font-family: var(--serif);
      font-size: 26px;
      color: var(--text);
      font-weight: 500;
    }

    .stat-card span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .filter-panel {
      background: rgba(255, 253, 251, 0.7);
      border-radius: 20px;
      border: 1px dashed var(--line);
      padding: 14px 16px;
      margin-top: 14px;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .filter-title {
      font-family: var(--serif);
      font-size: 22px;
      color: var(--text);
      margin-bottom: 12px;
    }

    .filter-form {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .filter-input,
    .filter-select {
      min-width: 180px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--text);
      padding: 0 16px;
      font-family: var(--sans);
      font-size: 12px;
      outline: none;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: var(--blush);
      box-shadow: 0 0 0 3px rgba(244, 182, 168, 0.16);
    }

    .filter-reset {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--cream);
      color: var(--text);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: transform 0.22s ease;
    }

    .filter-reset:hover {
      transform: translateY(-2px);
    }

    .shop-list-wrap {
      background: rgba(255, 253, 251, 0.5);
      border-radius: 26px;
      border: 1px dashed var(--line);
      padding: 16px;
      margin-top: 14px;
    }

    .result-count {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    #shop-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .shop-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: 0 10px 22px var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .shop-card::before {
      content: "";
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--soft), transparent 70%);
      position: absolute;
      right: -30px;
      top: -20px;
      filter: blur(5px);
      opacity: 0.74;
    }

    .shop-card:hover {
      transform: translateY(-8px);
      border-color: var(--blush);
      box-shadow: 0 16px 34px var(--shadow);
    }

    .shop-card h2 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }

    .shop-card p {
      margin: 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .shop-card .tagline {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--blush);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

      .store-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="shop-page">
    <header class="store-header">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1 class="brand-title">Shops</h1>
          <p class="brand-sub">Gathering List</p>
        </div>
      </div>
      <div class="header-links">
        <span></span>
        <span>Tokyo Collection</span>
      </div>
    </header>

    <section class="hero">
      <section class="hero-copy">
        <p class="section-kicker">Wishful Places</p>
        <h2 class="hero-title">Today’s <span>little</span><br>favorites</h2>
        <p class="hero-lede">静かな通りにある、探しに行きたくなるお店だけを集めたリストです。</p>
        <div class="hero-actions">
          <a class="cta-button" href="#shop-list">Find a Store</a>
          <span class="hero-note">12 shops nearby</span>
        </div>
      </section>

      <section class="hero-card">
        <div class="mini-map">
          <div class="pin"></div>
        </div>
      </section>
    </section>

    <section class="card-grid">
      <div class="stat-card">
        <div class="icon">✎</div>
        <div>
          <strong>24</strong>
          <span>Curated</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon">☻</div>
        <div>
          <strong>06</strong>
          <span>Favorite</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon">☼</div>
        <div>
          <strong>09</strong>
          <span>Open</span>
        </div>
      </div>
    </section>

    <section class="filter-panel">
      <div class="filter-title">絞り込み</div>
      <div class="filter-form">
        <label class="filter-label" for="shop-search">店舗名検索</label>
        <input type="text" id="shop-search" class="filter-input" placeholder="店名またはカテゴリ" autocomplete="off">

        <label class="filter-label" for="category-filter">カテゴリ</label>
        <select id="category-filter" class="filter-select">
          <option value="">全カテゴリ</option>
        </select>

        <button id="reset-filter" class="filter-reset">リセット</button>
      </div>
    </section>

    <section class="shop-list-wrap">
      <div class="result-count" id="result-count">0件</div>
      <div id="shop-list">読み込み中...</div>
    </section>
  </div>

  <script>
    let allStores = [];

    async function loadStores() {
      try {
        const response = await fetch('stores_2.json');

        if (!response.ok) {
          throw new Error('データの取得に失敗しました');
        }

        allStores = await response.json();
        const container = document.getElementById('shop-list');
        const categoryFilter = document.getElementById('category-filter');
        const uniqueCategories = Array.from(new Set(allStores.map(shop => shop.category).filter(Boolean))).sort();

        uniqueCategories.forEach(category => {
          const option = document.createElement('option');
          option.value = category;
          option.textContent = category;
          categoryFilter.appendChild(option);
        });

        renderStores(allStores);
      } catch (error) {
        const errorArea = document.getElementById('shop-list');
        errorArea.textContent = '店舗情報の読み込みエラーが発生しました。';
        console.error(error);
      }
    }

    function renderStores(stores) {
      const container = document.getElementById('shop-list');
      const resultCount = document.getElementById('result-count');
      container.innerHTML = '';

      if (stores.length === 0) {
        container.innerHTML = '<div class="shop-card"><h2>該当する店舗がありません</h2><p>検索条件を変更して再度お試しください。</p></div>';
        resultCount.textContent = '0件';
        return;
      }

      stores.forEach(shop => {
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
          <span class="tagline">${shop.category || 'shop'}</span>
          <h2>${shop.name}</h2>
          <p><strong>住所:</strong> ${shop.address || '住所情報なし'}</p>
          <p><strong>カテゴリ:</strong> ${shop.category || 'カテゴリ未登録'}</p>
          <p><strong>営業時間:</strong> ${shop.hours || '営業時間情報なし'}</p>
        `;
        container.appendChild(card);
      });

      resultCount.textContent = `${stores.length}件`;
    }

    function updateSearch() {
      const searchText = document.getElementById('shop-search').value.trim().toLowerCase();
      const selectedCategory = document.getElementById('category-filter').value;

      const filtered = allStores.filter(shop => {
        const categoryMatch = selectedCategory ? shop.category === selectedCategory : true;
        const effectiveSearch = searchText ? (
          shop.name.toLowerCase().includes(searchText) ||
          shop.category.toLowerCase().includes(searchText) ||
          (shop.facility && shop.facility.toLowerCase().includes(searchText))
        ) : true;

        return categoryMatch && effectiveSearch;
      });

      renderStores(filtered);
    }

    document.getElementById('shop-search').addEventListener('input', updateSearch);
    document.getElementById('category-filter').addEventListener('change', updateSearch);
    document.getElementById('reset-filter').addEventListener('click', () => {
      document.getElementById('shop-search').value = '';
      document.getElementById('category-filter').value = '';
      renderStores(allStores);
    });

    loadStores();
  </script>

</body>
</html>
